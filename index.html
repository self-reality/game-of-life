<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game of Life</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="canvas-wrap">
        <canvas id="lifeCanvas" aria-label="Game of Life simulation" data-i18n-aria-label="canvasLabel"></canvas>
        <p class="stage-hint" role="status" data-i18n="exitHint">Press Esc to exit full screen</p>
      </section>
      <aside class="panel">
        <header class="panel-head">
          <h1 data-i18n="title">Game of Life</h1>
          <details id="langMenu" class="lang-menu">
            <summary aria-label="Language" data-i18n-aria-label="language">
              <img id="langFlag" class="lang-flag" src="flags/gb.svg" alt="" />
              <span id="langName">English</span>
            </summary>
            <div id="langList" class="lang-list"></div>
          </details>
        </header>
        <section class="panel-section">
          <div class="action-row">
            <button
              type="button"
              class="ghost-button"
              data-action="toggle-fullscreen"
              title="Shortcut: F"
              data-i18n="fullscreen"
              data-i18n-title="fullscreenShortcut"
            >
              Full screen
            </button>
            <button
              type="button"
              class="ghost-button"
              data-action="toggle-sound"
              aria-pressed="false"
              title="Shortcut: M"
            >
              Sound: off
            </button>
          </div>
          <div class="control">
            <label data-i18n="screenRatio">Screen ratio</label>
            <div id="ratioPresets" class="preset-row"></div>
          </div>
        </section>
        <details class="panel-section panel-fold">
          <summary><h2 data-i18n="settings">Settings</h2></summary>
          <div class="control">
            <label for="colsRange" data-i18n="fieldWidth">Field width (cells)</label>
            <div class="control-row">
              <input id="colsRange" type="range" min="30" max="320" step="1" value="248" />
              <input id="colsNumber" type="number" min="30" max="320" step="1" value="248" />
            </div>
          </div>
          <div class="control">
            <label for="rowsRange" data-i18n="fieldHeight">Field height (cells)</label>
            <div class="control-row">
              <input id="rowsRange" type="range" min="30" max="220" step="1" value="136" />
              <input id="rowsNumber" type="number" min="30" max="220" step="1" value="136" />
            </div>
          </div>
          <div class="control">
            <label for="horizontalEdges" data-i18n="horizontalEdges">Horizontal edges</label>
            <div class="control-row">
              <select id="horizontalEdges">
                <option value="wrap" data-i18n="edgesWrap">Wrap (cylinder)</option>
                <option value="wall" data-i18n="edgesWall">Wall</option>
              </select>
            </div>
          </div>
          <div class="control">
            <label for="cellSizeRange" data-i18n="resolution">Resolution (px per cell)</label>
            <div class="control-row">
              <input id="cellSizeRange" type="range" min="3" max="16" step="1" value="6" />
              <input id="cellSizeNumber" type="number" min="3" max="16" step="1" value="6" />
            </div>
          </div>
          <div class="control">
            <label for="speedRange" data-i18n="speed">Speed (steps/sec)</label>
            <div class="control-row">
              <input id="speedRange" type="range" min="1" max="60" step="1" value="18" />
              <input id="speedNumber" type="number" min="1" max="60" step="1" value="18" />
            </div>
          </div>
          <div class="control">
            <label for="marginRange" data-i18n="gridMargin">Grid margin (px)</label>
            <div class="control-row">
              <input id="marginRange" type="range" min="0" max="80" step="1" value="24" />
              <input id="marginNumber" type="number" min="0" max="80" step="1" value="24" />
            </div>
          </div>
          <div class="control">
            <label for="gridThicknessRange" data-i18n="gridThickness">Grid thickness (px)</label>
            <div class="control-row">
              <input id="gridThicknessRange" type="range" min="0.5" max="2" step="0.5" value="1" />
              <input id="gridThicknessNumber" type="number" min="0.5" max="2" step="0.5" value="1" />
            </div>
          </div>
          <div class="control">
            <label for="glowBlurRange" data-i18n="glowBlur">Glow blur (px)</label>
            <div class="control-row">
              <input id="glowBlurRange" type="range" min="0" max="24" step="1" value="3" />
              <input id="glowBlurNumber" type="number" min="0" max="24" step="1" value="3" />
            </div>
          </div>
          <div class="control">
            <label for="glowAlphaRange" data-i18n="glowStrength">Glow strength</label>
            <div class="control-row">
              <input id="glowAlphaRange" type="range" min="0" max="1" step="0.05" value="1" />
              <input id="glowAlphaNumber" type="number" min="0" max="1" step="0.05" value="1" />
            </div>
          </div>
          <div class="control">
            <label for="glowBlendMode" data-i18n="glowBlend">Glow blend mode</label>
            <div class="control-row">
              <select id="glowBlendMode">
                <option value="source-over">Source over</option>
                <option value="source-in">Source in</option>
                <option value="source-out">Source out</option>
                <option value="source-atop">Source atop</option>
                <option value="destination-over">Destination over</option>
                <option value="destination-in">Destination in</option>
                <option value="destination-out">Destination out</option>
                <option value="destination-atop">Destination atop</option>
                <option value="xor">Xor</option>
                <option value="copy">Copy</option>
                <option value="multiply">Multiply</option>
                <option value="screen">Screen</option>
                <option value="overlay">Overlay</option>
                <option value="darken">Darken</option>
                <option value="lighten">Lighten</option>
                <option value="color-dodge">Color dodge</option>
                <option value="color-burn">Color burn</option>
                <option value="hard-light">Hard light</option>
                <option value="soft-light">Soft light</option>
                <option value="difference">Difference</option>
                <option value="exclusion">Exclusion</option>
                <option value="hue">Hue</option>
                <option value="saturation">Saturation</option>
                <option value="color">Color</option>
                <option value="luminosity">Luminosity</option>
                <option value="lighter" selected>Lighter</option>
              </select>
            </div>
          </div>
          <div class="control">
            <label data-i18n="colors">Colors</label>
            <div class="control-row">
              <div class="color-group">
                <span data-i18n="colorBackground">Background</span>
                <input id="bgColor" type="color" value="#000000" />
              </div>
              <div class="color-group">
                <span data-i18n="colorGrid">Grid</span>
                <input id="gridColor" type="color" value="#2b2b2b" />
              </div>
            </div>
            <div class="control-row">
              <div class="color-group">
                <span data-i18n="colorAlive1">Alive 1</span>
                <input id="alive1Color" type="color" value="#ff3b3b" />
              </div>
              <div class="color-group">
                <span data-i18n="colorAlive2">Alive 2+</span>
                <input id="alive2Color" type="color" value="#16c172" />
              </div>
              <div class="color-group">
                <span data-i18n="colorAlive10">Alive 10+</span>
                <input id="alive10Color" type="color" value="#2f7cff" />
              </div>
            </div>
          </div>
          <div class="control">
            <label for="injectionsRange" data-i18n="shipsPerSpawn">Ships per spawn</label>
            <div class="control-row">
              <input id="injectionsRange" type="range" min="1" max="8" step="1" value="1" />
              <input id="injectionsNumber" type="number" min="1" max="8" step="1" value="1" />
            </div>
          </div>
          <div class="control">
            <label for="injectionPeriodRange" data-i18n="spawnPeriod">Spawn period (steps)</label>
            <div class="control-row">
              <input id="injectionPeriodRange" type="range" min="10" max="300" step="1" value="80" />
              <input id="injectionPeriodNumber" type="number" min="10" max="300" step="1" value="80" />
            </div>
          </div>
        </details>
        <!-- English only: these are the terms synths use everywhere. -->
        <details class="panel-section panel-fold" lang="en" dir="ltr">
          <summary><h2>Sound</h2></summary>
          <div class="control">
            <label for="soundRegionCountRange">Voice regions</label>
            <div class="control-row">
              <input id="soundRegionCountRange" type="range" min="1" max="8" step="1" value="4" />
              <input id="soundRegionCountNumber" type="number" min="1" max="8" step="1" value="4" />
            </div>
          </div>
          <div class="control">
            <label for="soundOctavesRange">Octaves across height</label>
            <div class="control-row">
              <input id="soundOctavesRange" type="range" min="1" max="12" step="1" value="4" />
              <input id="soundOctavesNumber" type="number" min="1" max="12" step="1" value="4" />
            </div>
          </div>
          <div class="control">
            <label for="soundCenterOctaveRange">Center octave</label>
            <div class="control-row">
              <input id="soundCenterOctaveRange" type="range" min="-2" max="10" step="1" value="0" />
              <input id="soundCenterOctaveNumber" type="number" min="-2" max="10" step="1" value="0" />
            </div>
          </div>
          <div class="control">
            <label for="soundStartRandomRange">Note start randomization (ms)</label>
            <div class="control-row">
              <input id="soundStartRandomRange" type="range" min="0" max="100" step="1" value="6" />
              <input id="soundStartRandomNumber" type="number" min="0" max="100" step="1" value="6" />
            </div>
          </div>
          <div class="control">
            <div class="control-head">
              <label>Region voices</label>
              <button id="soundResetRegions" type="button" class="ghost-button">
                Reset to cycle
              </button>
            </div>
            <div id="soundRegions" class="region-list"></div>
          </div>
        </details>
        <section class="panel-section">
          <h2 data-i18n="status">Status</h2>
          <div class="status-grid">
            <div class="status-item">
              <span data-i18n="density">Density p</span>
              <strong id="statusDensity">0.000</strong>
            </div>
            <div class="status-item">
              <span data-i18n="soundsAtOnce">Sounds at once</span>
              <strong id="statusSounds">0</strong>
            </div>
          </div>
        </section>
      </aside>
    </main>
    <script src="https://unpkg.com/tone@latest/build/Tone.js"></script>
    <script src="sound/sound_mapping.js"></script>
    <script src="sound/drift_emulator.js"></script>
    <script src="simulation_core.js"></script>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
  </body>
</html>
